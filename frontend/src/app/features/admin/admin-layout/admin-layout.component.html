<mat-sidenav-container class="sidenav-container">
  <mat-sidenav
    #sidenav
    [mode]="isMobile ? 'over' : 'side'"
    [opened]="sidenavOpened"
    class="admin-sidenav"
  >
    <div class="sidenav-header">
      <mat-icon>confirmation_number</mat-icon>
      <span>Admin Panel</span>
    </div>

    <mat-nav-list>
      @for (item of navItems; track item.route) {
        <a
          mat-list-item
          [routerLink]="item.route"
          routerLinkActive="active-nav"
          [routerLinkActiveOptions]="{ exact: item.route === '/admin' }"
          (click)="isMobile && (sidenavOpened = false)"
        >
          <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
          <span matListItemTitle>{{ item.label }}</span>
        </a>
      }
    </mat-nav-list>

    <div class="sidenav-footer">
      <button mat-button class="logout-btn" (click)="logout()">
        <mat-icon>logout</mat-icon> Çıkış Yap
      </button>
    </div>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar class="admin-toolbar" color="primary">
      <button mat-icon-button (click)="sidenavOpened = !sidenavOpened">
        <mat-icon>menu</mat-icon>
      </button>
      <span>Event & Ticket Reservation System</span>
      <span class="spacer"></span>
      <span class="admin-chip">
        <mat-icon>admin_panel_settings</mat-icon>
        {{ authService.getUsername() }}
      </span>
    </mat-toolbar>

    <div class="content-area">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
